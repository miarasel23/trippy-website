<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="40" fill="#f1f5f9"/>
  <rect x="16" y="16" width="480" height="480" rx="36" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  
  <!-- Cabin Roof -->
  <polygon points="150,230 200,155 320,155 385,230" fill="#334155"/>
  
  <!-- Windows -->
  <polygon points="205,165 315,165 365,225 165,225" fill="#10b981" opacity="0.9"/>
  <line x1="260" y1="165" x2="260" y2="225" stroke="#334155" stroke-width="6"/>
  
  <!-- Lower Body -->
  <rect x="90" y="225" width="332" height="90" rx="18" fill="#0f172a"/>
  
  <!-- Headlight and Taillight -->
  <rect x="395" y="240" width="23" height="15" rx="6" fill="#fbbf24"/>
  <rect x="94" y="240" width="21" height="15" rx="6" fill="#ef4444"/>
  
  <!-- Wheels -->
  <circle cx="170" cy="320" r="40" fill="#1e293b" stroke="#cbd5e1" stroke-width="5"/>
  <circle cx="170" cy="320" r="15" fill="#94a3b8"/>
  
  <circle cx="340" cy="320" r="40" fill="#1e293b" stroke="#cbd5e1" stroke-width="5"/>
  <circle cx="340" cy="320" r="15" fill="#94a3b8"/>
  
  <!-- Ground Shadow Line -->
  <rect x="70" y="355" width="372" height="7" rx="3" fill="#cbd5e1"/>
</svg>
